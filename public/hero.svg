<svg viewBox="0 0 420 720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDEFF7"/>
      <stop offset="100%" stop-color="#EFE9FB"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B18CF5"/>
      <stop offset="100%" stop-color="#7B5CE0"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6CF0"/>
      <stop offset="100%" stop-color="#6C4FD9"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6C4FD9" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="420" height="720" fill="url(#bgGrad)"/>

  <!-- decorative dots -->
  <g fill="#E3B8D8" opacity="0.55">
    <circle cx="30" cy="70" r="4"/>
    <circle cx="55" cy="120" r="3"/>
    <circle cx="20" cy="180" r="3"/>
    <circle cx="390" cy="90" r="4"/>
    <circle cx="370" cy="150" r="3"/>
    <circle cx="35" cy="420" r="3"/>
    <circle cx="20" cy="480" r="4"/>
    <circle cx="395" cy="380" r="3"/>
    <circle cx="380" cy="450" r="4"/>
    <circle cx="40" cy="620" r="3"/>
    <circle cx="390" cy="600" r="3"/>
    <circle cx="60" cy="660" r="4"/>
  </g>
  <g fill="#C9A8F0" opacity="0.5">
    <circle cx="80" cy="40" r="2.5"/>
    <circle cx="340" cy="60" r="2.5"/>
    <circle cx="70" cy="560" r="2.5"/>
    <circle cx="350" cy="520" r="2.5"/>
  </g>

  <!-- tiny sparkle stars -->
  <g fill="#F0A8CE">
    <path d="M64 96 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z"/>
    <path d="M356 210 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z"/>
    <path d="M46 540 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z"/>
  </g>

  <!-- headline -->
  <text x="210" y="86" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="30" fill="#6C4FD9">Book Detail</text>
  <text x="210" y="122" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="700" font-size="30" fill="#6C4FD9">&amp; Order</text>
  <text x="210" y="152" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="13" fill="#8A7FA0">Preview and order in just a few taps</text>

  <!-- decorative bubble icon top-right -->
  <g transform="translate(348,66)">
    <path d="M-30,-2 a30,22 0 1 1 34,21 l4,12 -14,-8 a30,22 0 0 1 -24,-25 z" fill="#FFFFFF" stroke="#E9C9E0" stroke-width="1.5"/>
    <circle cx="-8" cy="-2" r="6" fill="#F0A8CE"/>
    <path d="M-10,-4 q2,-3 4,0 q2,-3 4,0 q0,4 -4,6 q-4,-2 -4,-6 z" fill="#FFFFFF" transform="translate(6,1) scale(0.6)"/>
  </g>

  <!-- ===== Phone A (back, list screen) ===== -->
  <g transform="translate(70,190) rotate(-6)" filter="url(#softShadow)">
    <rect x="0" y="0" width="200" height="410" rx="34" fill="#2C2B3A"/>
    <rect x="7" y="7" width="186" height="396" rx="28" fill="#FFFFFF"/>
    <!-- notch -->
    <rect x="76" y="14" width="48" height="10" rx="5" fill="#2C2B3A"/>
    <!-- header -->
    <text x="24" y="46" font-family="Arial, sans-serif" font-size="16" fill="#2C2B3A">&#8249;</text>
    <text x="100" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#2C2B3A">Your Cart</text>
    <circle cx="176" cy="42" r="3" fill="#B9B4C9"/>
    <circle cx="166" cy="42" r="3" fill="#B9B4C9"/>

    <!-- list rows -->
    <g font-family="Arial, sans-serif">
      <!-- row 1 -->
      <rect x="20" y="70" width="34" height="34" rx="9" fill="#F0A8CE"/>
      <rect x="64" y="76" width="86" height="7" rx="3.5" fill="#D8D4E4"/>
      <rect x="64" y="90" width="56" height="6" rx="3" fill="#E6E3EF"/>
      <circle cx="172" cy="87" r="8" fill="#EFE9FB" stroke="#B18CF5" stroke-width="1.5"/>

      <!-- row 2 -->
      <rect x="20" y="126" width="34" height="34" rx="9" fill="#8FD3C7"/>
      <rect x="64" y="132" width="96" height="7" rx="3.5" fill="#D8D4E4"/>
      <rect x="64" y="146" width="50" height="6" rx="3" fill="#E6E3EF"/>
      <circle cx="172" cy="143" r="8" fill="#EFE9FB" stroke="#B18CF5" stroke-width="1.5"/>

      <!-- row 3 -->
      <rect x="20" y="182" width="34" height="34" rx="9" fill="#F5C177"/>
      <rect x="64" y="188" width="78" height="7" rx="3.5" fill="#D8D4E4"/>
      <rect x="64" y="202" width="60" height="6" rx="3" fill="#E6E3EF"/>
      <circle cx="172" cy="199" r="8" fill="#6C4FD9"/>
      <path d="M168,199 l3,3 5,-6" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- row 4 -->
      <rect x="20" y="238" width="34" height="34" rx="9" fill="#B18CF5"/>
      <rect x="64" y="244" width="90" height="7" rx="3.5" fill="#D8D4E4"/>
      <rect x="64" y="258" width="46" height="6" rx="3" fill="#E6E3EF"/>
      <circle cx="172" cy="255" r="8" fill="#EFE9FB" stroke="#B18CF5" stroke-width="1.5"/>

      <!-- row 5 -->
      <rect x="20" y="294" width="34" height="34" rx="9" fill="#F0A8CE"/>
      <rect x="64" y="300" width="70" height="7" rx="3.5" fill="#D8D4E4"/>
      <rect x="64" y="314" width="58" height="6" rx="3" fill="#E6E3EF"/>
      <circle cx="172" cy="311" r="8" fill="#EFE9FB" stroke="#B18CF5" stroke-width="1.5"/>
    </g>

    <!-- bottom button -->
    <rect x="20" y="352" width="160" height="36" rx="18" fill="url(#btnGrad)"/>
    <text x="100" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">CHECKOUT</text>
  </g>

  <!-- ===== Phone B (front, product screen) ===== -->
  <g transform="translate(190,300) rotate(5)" filter="url(#softShadow)">
    <rect x="0" y="0" width="188" height="384" rx="32" fill="#2C2B3A"/>
    <rect x="7" y="7" width="174" height="370" rx="26" fill="#FFFFFF"/>
    <rect x="70" y="13" width="44" height="9" rx="4.5" fill="#2C2B3A"/>

    <!-- top bar -->
    <text x="22" y="42" font-family="Arial, sans-serif" font-size="14" fill="#2C2B3A">&#8249;</text>
    <circle cx="150" cy="38" r="10" fill="#F5F3FA"/>
    <path d="M146,38 q4,-6 8,0 q-4,6 -8,0z" fill="#F0A8CE"/>

    <!-- product illustration panel -->
    <rect x="18" y="56" width="148" height="132" rx="18" fill="url(#screenGrad)"/>
    <circle cx="92" cy="122" r="34" fill="#FFFFFF" opacity="0.18"/>
    <path d="M92,100 q14,0 14,14 q0,10 -14,22 q-14,-12 -14,-22 q0,-14 14,-14z" fill="#FFFFFF" opacity="0.9"/>

    <!-- title + rating -->
    <rect x="20" y="200" width="100" height="9" rx="4.5" fill="#D8D4E4"/>
    <rect x="20" y="214" width="60" height="7" rx="3.5" fill="#E6E3EF"/>
    <g fill="#F5C177">
      <path d="M138,203 l2,4 4,0.5 -3,3 0.7,4 -3.7,-2 -3.7,2 0.7,-4 -3,-3 4,-0.5z"/>
      <path d="M152,203 l2,4 4,0.5 -3,3 0.7,4 -3.7,-2 -3.7,2 0.7,-4 -3,-3 4,-0.5z"/>
    </g>

    <!-- price -->
    <text x="20" y="248" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#2C2B3A">$199.00</text>
    <rect x="20" y="256" width="70" height="6" rx="3" fill="#E6E3EF"/>

    <!-- add to cart button -->
    <rect x="18" y="332" width="148" height="34" rx="17" fill="url(#btnGrad)"/>
    <text x="92" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">ADD TO CART</text>
  </g>
</svg>
